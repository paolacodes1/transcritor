[project]
name = "transcritor"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "python-docx>=1.1",
    "av>=12",
    "numpy",
    "huggingface_hub",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false
